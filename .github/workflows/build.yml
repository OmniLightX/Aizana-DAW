name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize pinned dependencies
        run: git submodule update --init extern/JUCE extern/tracktion_engine
      - name: Install compiler prerequisites
        run: |
          brew install cmake faust
          cmake --version
          faust --version
          clang++ --version
      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAIZANA_UITEST_HOOK=OFF
      - name: Build
        run: cmake --build build --target Aizana engine_tests oop_host_smoke -j3
      - name: Verify dependency patches
        run: |
          python3 tests/test_recording_patch.py
          python3 tests/test_state_patch.py
          python3 tests/test_coreaudio_patch.py
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-diagnostics
          path: build/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
