name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Initialize pinned dependencies
        run: git submodule update --init extern/JUCE extern/tracktion_engine
      - name: Install compiler prerequisites
        run: |
          brew install cmake faust
          cmake --version
          faust --version
          clang++ --version
      - name: Configure Release
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAIZANA_UITEST_HOOK=OFF
      - name: Build
        run: cmake --build build --target Aizana engine_tests oop_host_smoke -j3
      - name: Verify dependency patches
        run: |
          python3 tests/test_recording_patch.py
          python3 tests/test_state_patch.py
          python3 tests/test_coreaudio_patch.py
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Capture crash diagnostics
        if: failure()
        timeout-minutes: 5
        continue-on-error: true
        run: |
          mkdir -p build/Testing/Temporary/crashes
          python3 - <<'PYREPORT'
          from pathlib import Path
          import shutil, time
          destination = Path('build/Testing/Temporary/crashes')
          for attempt in range(10):
              reports = []
              for root in (Path.home() / 'Library/Logs/DiagnosticReports', Path('/Library/Logs/DiagnosticReports')):
                  reports.extend(root.glob('engine_tests*'))
              for report in reports:
                  if report.is_file():
                      shutil.copy2(report, destination / report.name)
              if reports:
                  break
              time.sleep(1)
          PYREPORT
          lldb --batch -o 'process launch' -k 'thread backtrace all' -- \
            build/tests/engine_tests_artefacts/Release/engine_tests '[warp]' \
            > build/Testing/Temporary/warp-debugger.log 2>&1
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-diagnostics
          path: build/Testing/Temporary/
          retention-days: 7
          if-no-files-found: ignore
